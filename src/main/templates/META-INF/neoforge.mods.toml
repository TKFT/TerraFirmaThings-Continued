modLoader = "javafml" #mandatory

loaderVersion = "${loader_version_range}" #mandatory

license = "${mod_license}"

issueTrackerURL = "https://github.com/TKFT/TerraFirmaThings-Continued/issues"

[[mods]]

modId = "${mod_id}"

version = "${mod_version}"

displayName = "${mod_name}"

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

displayURL = "https://github.com/TKFT/TerraFirmaThings-Continued"

logoFile = "tfcthings.png"

credits = "Lyeoj for art and model assets and the original mod. Developed for 1.21.1 by RustySnail" #optional

authors = "RustySnail"

description = '''
Extra Utilities for TFC
'''

[[mixins]]
config = "${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

[[dependencies.${ mod_id }]]
modId = "neoforge"

type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "tfc"
type = "required"
versionRange = "[4.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "curios"
type = "optional"
versionRange = "[9.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "tfcambiental"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "cold_sweat"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "thermia"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
